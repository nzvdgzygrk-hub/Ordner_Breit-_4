name: OrdnerBreit
options:
  bundleIdPrefix: de.fatih
  deploymentTarget:
    iOS: "16.0"

targets:
  OrdnerBreit:
    type: application
    platform: iOS
    sources:
      - path: ios-native/OrdnerBreit
        excludes:
          - Assets.xcassets
      - path: index.html
        buildPhase: resources
      - path: ios-native/OrdnerBreit/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fatih.ordnerbreit
        PRODUCT_NAME: Ordner Breit
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios-native/OrdnerBreit/Info.plist
      properties:
        CFBundleDisplayName: Ordner Breit
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
